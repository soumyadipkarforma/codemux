name: "Validate Gradle Wrapper"

on:
  push:
    branches:
      - main
      - android-10
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - main
      - android-10
    paths-ignore:
      - 'docs/**'

jobs:
  validation:
    name: "Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v3

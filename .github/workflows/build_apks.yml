name: Build APKs

on:
  push:
    branches:
      - main
      - ide
  pull_request:
    branches:
      - main
      - ide

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | cut -d '"' -f 2)
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | awk '{print $3}')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building version $VERSION_NAME ($VERSION_CODE)"

      - name: Build APKs
        run: ./gradlew assembleDebug

      - name: Archive APKs
        uses: actions/upload-artifact@v4
        with:
          name: Codemux-APKs-v${{ steps.version_info.outputs.VERSION_NAME }}
          path: |
            app/build/outputs/apk/debug/*.apk
